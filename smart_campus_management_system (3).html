<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Campus Management System</title>
<style>
:root{--navy:#172554;--blue:#3157d5;--bg:#f4f7fc;--text:#172033;--muted:#718096;--line:#e5eaf3;--white:#fff;--green:#16865b;--orange:#c77918;--red:#c33b4b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.sidebar{position:fixed;inset:0 auto 0 0;width:245px;background:#111d43;color:#fff;padding:24px 16px;display:flex;flex-direction:column;z-index:5}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 28px;font-size:17px;font-weight:700}.logo{width:38px;height:38px;border-radius:12px;background:#4568ec;display:grid;place-items:center;font-size:20px}
.nav-label{font-size:10px;letter-spacing:1.5px;color:#9eacd0;padding:12px 10px}
.nav button{width:100%;border:0;background:transparent;color:#cbd5ee;text-align:left;padding:12px;border-radius:9px;margin:3px 0;cursor:pointer;font-size:13px}.nav button.active,.nav button:hover{background:#293b75;color:white}
.side-bottom{margin-top:auto;color:#9eacd0;font-size:11px;padding:12px}
.main{margin-left:245px;min-height:100vh}.topbar{height:76px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:3}
.topbar small{color:var(--muted)}.user{display:flex;align-items:center;gap:10px;font-size:13px}.avatar{width:34px;height:34px;border-radius:50%;background:#e7ecff;color:#3157d5;display:grid;place-items:center;font-weight:bold}
.content{padding:30px 32px;max-width:1500px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.heading h1{font-size:25px;margin:0 0 7px}.heading p{margin:0;color:var(--muted);font-size:13px}
.btn{border:0;border-radius:8px;padding:10px 15px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer;font-size:12px}.btn:hover{filter:brightness(.94)}.btn.secondary{background:#edf1ff;color:#3157d5}.btn.danger{background:#fff0f1;color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:18px}.stat small{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:25px;margin:9px 0 4px}.stat span{font-size:11px;color:var(--green)}
.panel{padding:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.panel-head h3{font-size:15px;margin:0}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.search,select,input,textarea{font:inherit;border:1px solid #dce3ef;border-radius:7px;padding:9px 10px;background:#fff;color:var(--text);font-size:12px}.search{min-width:210px}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th{text-align:left;background:#f7f9fd;color:#718096;font-size:10px;text-transform:uppercase;letter-spacing:.6px;padding:12px 10px}td{padding:13px 10px;border-bottom:1px solid #edf0f5;font-size:12px}tr:last-child td{border-bottom:0}.pill{display:inline-block;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:bold;background:#e9f8f1;color:var(--green)}.pill.pending{background:#fff4e5;color:var(--orange)}.pill.failed{background:#fff0f1;color:var(--red)}
.actions{display:flex;gap:6px}.action{border:0;background:#f0f3fa;color:#405078;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:11px}
.grid-two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.empty{padding:30px;text-align:center;color:var(--muted);font-size:12px}
.modal-backdrop{display:none;position:fixed;inset:0;background:#101a35a8;z-index:10;align-items:center;justify-content:center;padding:18px}.modal-backdrop.show{display:flex}.modal{background:#fff;border-radius:14px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:22px}.modal h2{font-size:18px;margin:0 0 18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:11px;color:#596579;font-weight:bold}.field input,.field select{width:100%}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.notice{font-size:11px;color:var(--muted);margin-top:12px}.mobile-menu{display:none}
@media(max-width:900px){.sidebar{width:205px}.main{margin-left:205px}.stats{grid-template-columns:repeat(2,1fr)}.content{padding:22px}}
@media(max-width:650px){.sidebar{position:static;width:100%;height:auto;padding:12px}.brand{padding:3px 8px 10px}.nav{display:flex;overflow:auto}.nav-label,.side-bottom{display:none}.nav button{white-space:nowrap;width:auto;padding:9px}.main{margin:0}.topbar{height:58px;padding:0 16px}.content{padding:18px 14px}.heading{align-items:center}.heading h1{font-size:21px}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:21px}.grid-two{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<aside class="sidebar">
 <div class="brand"><div class="logo">🎓</div><div>SMART CAMPUS<br><small style="font-size:10px;color:#aab8df;font-weight:400">MANAGEMENT SYSTEM</small></div></div>
 <div class="nav-label">MAIN MENU</div>
 <nav class="nav" id="nav">
  <button class="active" data-page="dashboard">▦ &nbsp; Dashboard</button>
  <button data-page="students">♙ &nbsp; Students</button>
  <button data-page="faculty">♧ &nbsp; Faculty</button>
  <button data-page="timetable">▤ &nbsp; Time Table</button>
  <button data-page="examination">✎ &nbsp; Examination</button>
  <button data-page="fees">₹ &nbsp; Fee Management</button>
 </nav>
 <div class="side-bottom">Academic year 2026–2027<br>Smart Campus Portal · v1.0</div>
</aside>
<main class="main">
 <header class="topbar"><div><strong id="topTitle">Dashboard</strong><br><small>Welcome to your campus portal</small></div><div class="user"><div class="avatar">A</div><div><b>Administrator</b><br><small>College Admin</small></div></div></header>
 <section class="content" id="content"></section>
</main>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><h2 id="modalTitle">Add record</h2><form id="recordForm"><div class="form-grid" id="formFields"></div><div class="modal-actions"><button type="button" class="btn secondary" id="cancelBtn">Cancel</button><button class="btn" type="submit">Save record</button></div></form></div></div>
<script>
const configs={
 students:{title:'Student Management',singular:'Student',fields:[['studentId','Student ID'],['name','Student Name'],['rollNumber','Roll Number'],['department','Department'],['attendance','Attendance (%)','number'],['marks','Marks','number']],cols:['Student ID','Name','Roll Number','Department','Attendance','Marks'],keys:['studentId','name','rollNumber','department','attendance','marks']},
 faculty:{title:'Faculty Management',singular:'Faculty',fields:[['facultyId','Faculty ID'],['name','Name'],['subject','Subject'],['department','Department'],['experience','Experience (years)','number']],cols:['Faculty ID','Name','Subject','Department','Experience'],keys:['facultyId','name','subject','department','experience']},
 timetable:{title:'Time Table Management',singular:'Time Table Entry',fields:[['className','Class'],['subject','Subject'],['faculty','Faculty'],['room','Room'],['time','Time']],cols:['Class','Subject','Faculty','Room','Time'],keys:['className','subject','faculty','room','time']},
 examination:{title:'Examination Management',singular:'Exam Record',fields:[['examName','Exam / Subject'],['schedule','Exam Schedule','date'],['studentName','Student Name'],['marks','Marks','number'],['grades','Grade'],['result','Result']],cols:['Exam / Subject','Schedule','Student','Marks','Grade','Result'],keys:['examName','schedule','studentName','marks','grades','result']},
 fees:{title:'Fee Management',singular:'Fee Record',fields:[['studentName','Student Name'],['rollNumber','Roll Number'],['feeDetails','Fee Details'],['amount','Amount (₹)','number'],['paymentStatus','Payment Status','select',['Paid','Pending','Overdue']],['dueDate','Due Date','date']],cols:['Student','Roll Number','Fee Details','Amount','Payment Status','Due Date'],keys:['studentName','rollNumber','feeDetails','amount','paymentStatus','dueDate']}
};
const sample={
 students:[{studentId:'STU001',name:'Ananya Rao',rollNumber:'24001',department:'CSE',attendance:92,marks:86},{studentId:'STU002',name:'Rahul Kumar',rollNumber:'24014',department:'AIML',attendance:78,marks:74},{studentId:'STU003',name:'Priya Reddy',rollNumber:'24022',department:'CSE',attendance:96,marks:91}],
 faculty:[{facultyId:'FAC001',name:'Dr. Meena Sharma',subject:'Data Structures',department:'CSE',experience:8},{facultyId:'FAC002',name:'Mr. Arjun Rao',subject:'Digital Electronics',department:'AIML',experience:5}],
 timetable:[{className:'III CSE-A',subject:'DBMS',faculty:'Dr. Meena Sharma',room:'Block A - 204',time:'09:00 - 10:00 AM'},{className:'III ECE-B',subject:'Digital Electronics',faculty:'Mr. Arjun Rao',room:'Block B - 102',time:'10:00 - 11:00 AM'}],
 examination:[{examName:'DBMS Internal-1',schedule:'2026-12-02',studentName:'Ananya Rao',marks:86,grades:'A',result:'Pass'},{examName:'Mathematics Internal-1',schedule:'2026-12-04',studentName:'Rahul Kumar',marks:74,grades:'B',result:'Pass'}],
 fees:[{studentName:'Ananya Rao',rollNumber:'24001',feeDetails:'Tuition Fee - Semester 5',amount:25000,paymentStatus:'Paid',dueDate:'2026-11-30'},{studentName:'Rahul Kumar',rollNumber:'24014',feeDetails:'Tuition Fee - Semester 5',amount:25000,paymentStatus:'Pending',dueDate:'2026-11-25'}]
};
let data={};Object.keys(configs).forEach(k=>{try{data[k]=JSON.parse(localStorage.getItem('scms_'+k))||sample[k]}catch{data[k]=sample[k]}});
let page='dashboard',editingIndex=null;
function save(){Object.keys(data).forEach(k=>localStorage.setItem('scms_'+k,JSON.stringify(data[k])))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function statusPill(v){let s=String(v).toLowerCase();return `<span class="pill ${s==='pending'||s==='overdue'?'pending':s==='fail'?'failed':''}">${esc(v)}</span>`}
function heading(title,desc,button=''){return `<div class="heading"><div><h1>${title}</h1><p>${desc}</p></div>${button}</div>`}
function dashboard(){let pending=data.fees.filter(x=>x.paymentStatus!=='Paid').length;return heading('Campus Dashboard','Overview of students, faculty and academic activities')+`<div class="stats">
<div class="stat"><small>Total Students</small><strong>${data.students.length}</strong><span>Student records</span></div>
<div class="stat"><small>Total Faculty</small><strong>${data.faculty.length}</strong><span>Faculty records</span></div>
<div class="stat"><small>Exam Records</small><strong>${data.examination.length}</strong><span>Examination entries</span></div>
<div class="stat"><small>Pending Fees</small><strong>${pending}</strong><span>Requires follow-up</span></div></div>
<div class="grid-two"><div class="panel"><div class="panel-head"><h3>Recent Students</h3><button class="btn secondary" onclick="navigate('students')">View all</button></div>${miniTable('students',['studentId','name','department'])}</div>
<div class="panel"><div class="panel-head"><h3>Fee Payment Overview</h3><button class="btn secondary" onclick="navigate('fees')">Manage fees</button></div>${miniTable('fees',['studentName','amount','paymentStatus'])}</div>
<div class="panel"><div class="panel-head"><h3>Upcoming Examination Records</h3></div>${miniTable('examination',['examName','schedule','result'])}</div>
<div class="panel"><div class="panel-head"><h3>Today's Time Table</h3></div>${miniTable('timetable',['className','subject','time'])}</div></div>
<p class="notice">Demo data is included. Add, edit or delete records; your changes are saved in this browser using local storage.</p>`}
function miniTable(k,keys){let rows=data[k].slice(0,4);if(!rows.length)return '<div class="empty">No records available.</div>';return `<div class="table-wrap"><table><thead><tr>${keys.map(x=>`<th>${configs[k].fields.find(f=>f[0]===x)?.[1]||x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${keys.map(x=>`<td>${x==='paymentStatus'||x==='result'?statusPill(r[x]):esc(r[x])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function modulePage(k){let c=configs[k];return heading(c.title,'Add, search, update and manage '+c.singular.toLowerCase()+' records.',`<button class="btn" onclick="openModal('${k}')">＋ Add ${c.singular}</button>`)+`<div class="panel"><div class="panel-head"><h3>All ${c.singular} Records <span style="color:#8792a7;font-weight:400">(${data[k].length})</span></h3><div class="toolbar"><input class="search" id="searchInput" placeholder="Search records..." oninput="renderTable('${k}')"></div></div><div id="tableArea">${table(k)}</div></div>`}
function table(k){let c=configs[k],q=(document.getElementById('searchInput')?.value||'').toLowerCase();let rows=data[k].map((r,i)=>({r,i})).filter(x=>c.keys.some(key=>String(x.r[key]??'').toLowerCase().includes(q)));if(!rows.length)return '<div class="empty">No matching records. Click Add to create your first record.</div>';return `<div class="table-wrap"><table><thead><tr>${c.cols.map(x=>`<th>${x}</th>`).join('')}<th>Actions</th></tr></thead><tbody>${rows.map(({r,i})=>`<tr>${c.keys.map((key,j)=>`<td>${(key==='paymentStatus'||key==='result')?statusPill(r[key]):esc(r[key])}</td>`).join('')}<td><div class="actions"><button class="action" onclick="openModal('${k}',${i})">Edit</button><button class="action" onclick="removeRecord('${k}',${i})">Delete</button></div></td></tr>`).join('')}</tbody></table></div>`}
function renderTable(k){let el=document.getElementById('tableArea');if(el)el.innerHTML=table(k)}
function navigate(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('topTitle').textContent=p==='dashboard'?'Dashboard':configs[p].title;render()}
function render(){document.getElementById('content').innerHTML=page==='dashboard'?dashboard():modulePage(page)}
function openModal(k,index=null){editingIndex=index;let c=configs[k],r=index===null?{}:data[k][index];document.getElementById('modalTitle').textContent=(index===null?'Add ':'Edit ')+c.singular;document.getElementById('formFields').innerHTML=c.fields.map(f=>{let type=f[2]||'text',extra='',value=esc(r[f[0]]??'');if(k==='students'&&f[0]==='studentId')extra='inputmode="text" pattern="[A-Za-z0-9_-]+" title="Student ID: letters and numbers only"';if(k==='students'&&f[0]==='name')extra='pattern="[A-Za-z ]+" title="Letters and spaces only" oninput="this.value=this.value.replace(/[^A-Za-z ]/g,\'\')"';if(k==='students'&&f[0]==='rollNumber')extra='inputmode="numeric" pattern="[0-9]+" title="Numbers only" oninput="this.value=this.value.replace(/[^0-9]/g,\'\')"';let input='';if(k==='students'&&f[0]==='department'){input=`<select name="${f[0]}" required><option value="">Select department</option><option value="CSE" ${r[f[0]]==='CSE'?'selected':''}>CSE</option><option value="AIML" ${r[f[0]]==='AIML'?'selected':''}>AIML</option></select>`}else{input=`<input name="${f[0]}" type="${type==='number'?'number':'text'}" value="${value}" ${type==='number'?'min="0"':''} ${k==='students'&&(f[0]==='attendance'||f[0]==='marks')?'max="100" step="any"':''} ${extra} required>`}return `<div class="field"><label>${f[1]}</label>${input}</div>`}).join('');document.getElementById('recordForm').dataset.module=k;document.getElementById('modalBackdrop').classList.add('show')}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show')}
document.getElementById('cancelBtn').onclick=closeModal;
document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
document.getElementById('recordForm').addEventListener('submit',e=>{e.preventDefault();let k=e.target.dataset.module,c=configs[k],fd=new FormData(e.target),r={};if(k==='students'){let nm=String(fd.get('name')||''),roll=String(fd.get('rollNumber')||''),dept=String(fd.get('department')||''),att=Number(fd.get('attendance')),marks=Number(fd.get('marks'));if(!/^[A-Za-z ]+$/.test(nm)){alert('Student name must contain letters and spaces only.');return}if(!/^[0-9]+$/.test(roll)){alert('Roll Number must contain digits only.');return}if(!['CSE','AIML'].includes(dept)){alert('Department must be CSE or AIML only.');return}if(!Number.isFinite(att)||att<0||att>100||!Number.isFinite(marks)||marks<0||marks>100){alert('Attendance and marks must be numbers between 0 and 100.');return}}c.fields.forEach(f=>r[f[0]]=f[2]==='number'?Number(fd.get(f[0])):fd.get(f[0]));if(k==='examination'&&!r.grades){r.grades=r.marks>=90?'A+':r.marks>=80?'A':r.marks>=70?'B':r.marks>=60?'C':'D'}if(k==='examination'&&!r.result)r.result=r.marks>=40?'Pass':'Fail';if(editingIndex===null)data[k].push(r);else data[k][editingIndex]=r;save();closeModal();render()});
function removeRecord(k,i){if(confirm('Delete this record?')){data[k].splice(i,1);save();render()}}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)navigate(b.dataset.page)});
render();
</script>
</body>
</html>
